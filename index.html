<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Logistik Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-page">
        <!-- Background Decoration -->
        <div class="auth-bg-decoration">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>

        <div class="auth-layout">
            <!-- Brand Panel -->
            <div class="brand-panel">
                <div class="brand-content">
                    <div class="brand-logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="64" height="64">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                            <line x1="12" y1="22.08" x2="12" y2="12"/>
                        </svg>
                    </div>
                    <h1 class="brand-title">Logistik Tracker</h1>
                    <p class="brand-subtitle">Sistem pencatatan data logistik ayam real-time</p>
                    
                    <div class="brand-features">
                        <div class="feature">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                            </svg>
                            <span>Keamanan Data</span>
                        </div>
                        <div class="feature">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                            </svg>
                            <span>Real-time Sync</span>
                        </div>
                        <div class="feature">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                                <rect x="2" y="3" width="20" height="14" rx="2"/>
                                <path d="M8 21h8"/>
                                <path d="M12 17v4"/>
                            </svg>
                            <span>Responsive UI</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Form Panel -->
            <div class="form-panel">
                <div class="form-card">
                    <div class="form-header">
                        <h2 id="form-title">Selamat Datang</h2>
                        <p id="form-subtitle">Masukkan kredensial untuk melanjutkan</p>
                    </div>

                    <form id="login-form" class="auth-form" novalidate>
                        <div class="form-group">
                            <label for="email">
                                <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                    <polyline points="22,6 12,13 2,6"/>
                                </svg>
                                Email
                            </label>
                            <div class="input-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                                    <path d="M22 6l-10 7L2 6"/>
                                </svg>
                                <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@logistik.local">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">
                                <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                                Password
                            </label>
                            <div class="input-wrapper password-wrapper">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                                <button type="button" class="toggle-password" id="toggle-password" aria-label="Tampilkan password">
                                    <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                    <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" style="display:none">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                        <line x1="1" y1="1" x2="23" y2="23"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="form-options">
                            <label class="checkbox-wrapper">
                                <input type="checkbox" id="remember" name="remember">
                                <span class="checkmark"></span>
                                <span>Ingat saya</span>
                            </label>
                            <a href="#" class="forgot-link" id="forgot-link">Lupa password?</a>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">
                            <span class="btn-text">Masuk</span>
                            <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                                <path d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                        </button>
                    </form>

                    <div id="auth-message" class="form-message" role="alert" aria-live="polite"></div>

                    <div class="auth-divider">
                        <span>atau</span>
                    </div>

                    <button type="button" class="btn btn-secondary btn-block" id="signup-toggle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <line x1="19" y1="8" x2="19" y2="14"/>
                            <line x1="22" y1="11" x2="16" y2="11"/>
                        </svg>
                        <span>Buat akun baru</span>
                    </button>

                    <div class="demo-credentials">
                        <p>Demo:</p>
                        <code>admin@logistik.local</code>
                        <code>rpajaya</code>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
    <script type="module">
        import { signIn, signUp } from './js/auth.js';

        const form = document.getElementById('login-form');
        const messageEl = document.getElementById('auth-message');
        const signupToggle = document.getElementById('signup-toggle');
        const forgotLink = document.getElementById('forgot-link');
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = submitBtn.querySelector('.btn-text');

        let isSignup = false;

        // Toggle password visibility
        togglePassword?.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            togglePassword.querySelector('.eye-open').style.display = type === 'password' ? 'block' : 'none';
            togglePassword.querySelector('.eye-closed').style.display = type === 'password' ? 'none' : 'block';
        });

        // Toggle signup/login
        signupToggle.addEventListener('click', (e) => {
            e.preventDefault();
            isSignup = !isSignup;
            
            if (isSignup) {
                formTitle.textContent = 'Buat Akun';
                formSubtitle.textContent = 'Daftar untuk mulai menggunakan aplikasi';
                btnText.textContent = 'Daftar';
                signupToggle.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <line x1="19" y1="8" x2="19" y2="14"/>
                        <line x1="22" y1="11" x2="16" y2="11"/>
                    </svg>
                    <span>Sudah punya akun? Masuk</span>
                `;
                forgotLink.style.display = 'none';
            } else {
                formTitle.textContent = 'Selamat Datang';
                formSubtitle.textContent = 'Masukkan kredensial untuk melanjutkan';
                btnText.textContent = 'Masuk';
                signupToggle.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <line x1="19" y1="8" x2="19" y2="14"/>
                        <line x1="22" y1="11" x2="16" y2="11"/>
                    </svg>
                    <span>Buat akun baru</span>
                `;
                forgotLink.style.display = 'block';
            }
            messageEl.textContent = '';
            messageEl.className = 'form-message';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = form.email.value.trim();
            const password = form.password.value;

            messageEl.textContent = '';
            messageEl.className = 'form-message';

            if (!email || !password) {
                showMessage('Email dan password wajib diisi', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            btnText.textContent = isSignup ? 'Mendaftar...' : 'Masuk...';

            try {
                if (isSignup) {
                    await signUp(email, password);
                    showMessage('Registrasi berhasil! Silakan cek email untuk verifikasi.', 'success');
                    signupToggle.click(); // Switch back to login
                } else {
                    await signIn(email, password);
                    window.location.href = 'input.html';
                }
            } catch (error) {
                console.error('Auth error:', error);
                showMessage(error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
                btnText.textContent = isSignup ? 'Daftar' : 'Masuk';
            }
        });

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = `form-message ${type}`;
        }
    </script>
</body>
</html>
