<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Logistik Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Logistik Tracker</h1>
                <p>Silakan login untuk melanjutkan</p>
            </div>
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>
            <div id="auth-message" class="auth-message"></div>
            <p class="auth-footer">Belum punya akun? <a href="#" id="signup-link">Daftar di sini</a></p>
        </div>
    </div>
    <script type="module" src="js/auth.js"></script>
    <script type="module">
        import { signIn, signUp } from './js/auth.js';
        // import { requireAuth } from './js/router.js'; // TIDAK DIPERLUKAN di login page

        // requireAuth(); // HAPUS: ini menyebabkan loop di halaman login

        const form = document.getElementById('login-form');
        const messageEl = document.getElementById('auth-message');
        const signupLink = document.getElementById('signup-link');
        let isSignup = false;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = form.email.value.trim();
            const password = form.password.value;

            messageEl.textContent = '';
            messageEl.className = 'auth-message';

            try {
                if (isSignup) {
                    await signUp(email, password);
                    messageEl.textContent = 'Registrasi berhasil! Silakan cek email untuk verifikasi.';
                    messageEl.classList.add('success');
                    isSignup = false;
                    form.querySelector('button').textContent = 'Login';
                    signupLink.textContent = 'Daftar di sini';
                    document.querySelector('.auth-header p').textContent = 'Silakan login untuk melanjutkan';
                } else {
                    await signIn(email, password);
                    window.location.href = 'input.html';
                }
            } catch (error) {
                messageEl.textContent = error.message;
                messageEl.classList.add('error');
            }
        });

        signupLink.addEventListener('click', (e) => {
            e.preventDefault();
            isSignup = !isSignup;
            if (isSignup) {
                form.querySelector('button').textContent = 'Daftar';
                signupLink.textContent = 'Kembali ke login';
                document.querySelector('.auth-header p').textContent = 'Buat akun baru';
            } else {
                form.querySelector('button').textContent = 'Login';
                signupLink.textContent = 'Daftar di sini';
                document.querySelector('.auth-header p').textContent = 'Silakan login untuk melanjutkan';
            }
            messageEl.textContent = '';
            messageEl.className = 'auth-message';
        });
    </script>
</body>
</html>
