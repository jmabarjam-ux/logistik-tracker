<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Logistik Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2>Masuk</h2>
            </div>
            <form id="login-form" class="auth-form-simple" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@logistik.local">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Masuk</button>
            </form>
            <div id="auth-message" class="form-message" role="alert" aria-live="polite"></div>
            <p class="mt-3 small text-center" style="font-size: 0.75rem; color: #6c757d;">
                <kbd>admin@logistik.local</kbd> / <kbd>rpajaya</kbd>
            </p>
        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
