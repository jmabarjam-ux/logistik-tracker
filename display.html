<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Logistik - Logistik Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="table-header">
                <h3>Daftar Data Logistik</h3>
            </div>
            <div class="table-toolbar">
                <div class="search-box">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    <input type="search" id="search-input" placeholder="Cari nama logistik, no polisi, kode..." aria-label="Cari data">
                </div>
            </div>
            <div class="table-responsive">
                <table id="data-table" class="data-table">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama Logistik</th>
                            <th>No. Polisi</th>
                            <th>Ukuran Ayam</th>
                            <th>Waktu Input</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                    </tbody>
                </table>
            </div>
            <div id="empty-state" class="empty-state" style="display: none;">
                <p>Belum ada data. <a href="input.html">Tambah data pertama</a></p>
            </div>
            <div id="loading-state" class="loading-state">
                <div class="spinner"></div>
                <p>Memuat data...</p>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="edit-modal-title">Edit Data Logistik</h3>
                <button class="modal-close" aria-label="Tutup">&times;</button>
            </div>
            <form id="edit-form" class="modal-form">
                <input type="hidden" id="edit-id" name="id">
                <div class="form-group">
                    <label for="edit-kode-logistik">Kode Logistik <span class="required">*</span></label>
                    <input type="text" id="edit-kode-logistik" name="kode_logistik" required>
                </div>
                <div class="form-group">
                    <label for="edit-nama-logistik">Nama Logistik <span class="required">*</span></label>
                    <input type="text" id="edit-nama-logistik" name="nama_logistik" required>
                </div>
                <div class="form-group">
                    <label for="edit-nopol-kendaraan">No. Polisi Kendaraan <span class="required">*</span></label>
                    <input type="text" id="edit-nopol-kendaraan" name="nopol_kendaraan" required style="text-transform: uppercase;">
                </div>
                <div class="form-group">
                    <label for="edit-ukuran-ayam">Ukuran Ayam <span class="required">*</span></label>
                    <select id="edit-ukuran-ayam" name="ukuran_ayam" required>
                        <option value="Grade 1 (1.2-1.5kg)">Grade 1 (1.2-1.5 kg)</option>
                        <option value="Grade 2 (1.5-1.8kg)">Grade 2 (1.5-1.8 kg)</option>
                        <option value="Grade 3 (1.8-2kg)">Grade 3 (1.8-2 kg)</option>
                    </select>
                </div>
                <div id="edit-message" class="form-message"></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary modal-close">Batal</button>
                    <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
        <div class="modal-overlay"></div>
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h3 id="delete-modal-title">Hapus Data</h3>
                <button class="modal-close" aria-label="Tutup">&times;</button>
            </div>
            <div class="modal-body">
                <p>Yakin ingin menghapus data <strong id="delete-nama-logistik"></strong>?</p>
                <p class="text-muted">Tindakan ini tidak dapat dibatalkan.</p>
            </div>
            <div id="delete-message" class="form-message"></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary modal-close">Batal</button>
                <button type="button" id="confirm-delete" class="btn btn-danger">Hapus</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/display.js"></script>
</body>
</html>
